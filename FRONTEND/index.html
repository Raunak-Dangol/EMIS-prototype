<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NCCS Secondary School - Education Management Information System Login Portal">
    <title>NCCS EMIS — Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page">
        <!-- Decorative orb bottom-left -->
        <div class="login-orb"></div>

        <div class="login-card">
            <div class="logo-container">
                <!-- Inline SVG Logo (NCCS Purple) -->
                <!-- Custom Logo based on user upload -->
                <img src="/img/NCCSLOGO.png" alt="NCCS Secondary School">
    
                <p>Education Management Information System</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                    <span class="input-icon"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <span class="input-icon"></span>
                </div>

                <div id="loginError" class="login-error"></div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                <p>NCCS Secondary School &bull; Kathmandu, Nepal</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/api.js"></script>
    <script>
        // Check if already logged in
        (async () => {
            try {
                const data = await api.checkSession();
                if (data.authenticated) {
                    redirectByRole(data.user.role);
                }
            } catch (e) { /* not logged in */ }
        })();

        function redirectByRole(role) {
            if (role === 'admin') {
                window.location.href = '/admin/dashboard';
            } else {
                window.location.href = '/student/dashboard';
            }
        }

        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorDiv.textContent = 'Please enter both username and password.';
                errorDiv.classList.add('is-visible');
                return;
            }

            btn.classList.add('loading');
            errorDiv.classList.remove('is-visible');

            try {
                const data = await api.login(username, password);
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => redirectByRole(data.user.role), 500);
            } catch (error) {
                errorDiv.textContent = error.message || 'Invalid credentials. Please try again.';
                errorDiv.classList.add('is-visible');
                btn.classList.remove('loading');
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '' : type === 'error' ? '' : ''}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
